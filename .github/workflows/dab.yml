name: DAB receiver build
on:
  push:
    paths:
      - 'packaging/dab/**'
      - '.github/workflows/dab.yml'
  pull_request:
    paths:
      - 'packaging/dab/**'
      - '.github/workflows/dab.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test the ARM64 receiver library
        run: sh packaging/dab/install.sh "$RUNNER_TEMP/dab"
