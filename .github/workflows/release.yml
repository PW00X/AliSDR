name: Release

on:
  push:
    branches: [master]
    paths:
      # A version bump alone is unreleased; release notes explicitly publish it.
      - docs/releases/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-worker:
    if: github.repository == 'PW00X/AliSDR' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable Windows worker
        shell: pwsh
        run: ./packaging/windows-worker/build.ps1 -OutputZip "$env:RUNNER_TEMP/AliSDR-Worker-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-worker
          path: ${{ runner.temp }}/AliSDR-Worker-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: windows-worker
    if: github.repository == 'PW00X/AliSDR' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py alisdr tests
      - run: python -m unittest tests/test_core.py tests/test_addons.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-worker
          path: release-assets
      - name: Publish the version from source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const source = fs.readFileSync('alisdr/__init__.py', 'utf8');
            const match = source.match(/^__version__ = "(\d+\.\d+\.\d+)"$/m);
            if (!match) throw new Error('A stable source version is required.');
            const version = match[1];
            const tag = `v${version}`;
            const body = fs.readFileSync(`docs/releases/${version}.md`, 'utf8');
            const repo = context.repo;
            async function uploadWorker(release) {
              const name = 'AliSDR-Worker-Windows-x64.zip';
              const data = fs.readFileSync(`release-assets/${name}`);
              const digest = 'sha256:' + require('node:crypto').createHash('sha256').update(data).digest('hex');
              const assets = (await github.rest.repos.listReleaseAssets({ ...repo, release_id: release.id })).data;
              const previous = assets.find(asset => asset.name === name);
              if (previous?.digest === digest) return;
              if (previous) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: previous.id });
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/zip', 'content-length': data.length },
              });
              core.info(`Published ${name} (${digest})`);
            }
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              // Updating versioned release notes intentionally refreshes that
              // release and its source tag, including fixes on the same version.
              const ref = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              if (ref.data.object.sha !== context.sha) {
                await github.rest.git.updateRef({ ...repo, ref: `tags/${tag}`, sha: context.sha, force: true });
              }
              const release = await github.rest.repos.updateRelease({
                ...repo, release_id: existing.id, name: `AliSDR ${version}`, target_commitish: context.sha,
                body, draft: false, prerelease: false, make_latest: 'true',
              });
              await uploadWorker(release.data);
              await core.summary.addLink(`AliSDR ${version}`, release.data.html_url).write();
              return;
            }
            // Do not silently publish an existing tag from another commit.
            try {
              await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              throw new Error(`${tag} already exists without a release; inspect it before publishing.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const release = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `AliSDR ${version}`,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            await uploadWorker(release.data);
            await core.summary.addLink(`AliSDR ${version}`, release.data.html_url).write();
